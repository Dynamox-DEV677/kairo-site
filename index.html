<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000005" />

    <title>Kairo Industries — Building intelligent systems</title>
    <meta
      name="description"
      content="Kairo Industries is a technology company building intelligent systems, starting with education. Our first product is Kyno, an AI learning system for students."
    />

    <!-- Set this to the live URL once deployed. Google treats a wrong canonical
         as authoritative, so leaving a placeholder here is worse than omitting
         it — update it before you submit the sitemap. -->
    <link rel="canonical" href="https://kairoindustries.com/" />

    <!-- GOOGLE SEARCH CONSOLE
         Paste the verification tag Google gives you on the line below, then
         redeploy. The "HTML tag" method is the one that survives a rebuild —
         a verification FILE in public/ works too, but is easy to lose. -->
    <!-- <meta name="google-site-verification" content="PASTE_TOKEN_HERE" /> -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kairo Industries" />
    <meta property="og:title" content="Kairo Industries — Building intelligent systems" />
    <meta
      property="og:description"
      content="A technology company building intelligent systems, starting with education. Our first product is Kyno."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/kairo-mark-white.png" type="image/png" />
    <link rel="apple-touch-icon" href="/kairo-mark-white.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data. This is what puts the company name, logo, email and
         group into Google's knowledge graph rather than leaving it to guess. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Kairo Industries",
        "url": "https://kairoindustries.com/",
        "logo": "https://kairoindustries.com/kairo-mark-white.png",
        "email": "kairoindustries.cor@gmail.com",
        "foundingLocation": { "@type": "Place", "name": "Chennai, India" },
        "description": "A technology company building intelligent systems, starting with education.",
        "sameAs": ["https://groups.google.com/g/kairo-industries"],
        "makesOffer": {
          "@type": "Offer",
          "itemOffered": {
            "@type": "SoftwareApplication",
            "name": "Kyno",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Android, Web"
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
